<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Competitive Programming Solutions" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <circle cx="910" cy="30" r="150" fill="#6366f1" opacity="0.14"/>
    <circle cx="60" cy="300" r="130" fill="#22d3ee" opacity="0.08"/>

    <text x="60" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="4" fill="#818cf8">COMPETITIVE PROGRAMMING</text>
    <text x="58" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="#f8fafc">Solutions</text>
    <text x="60" y="186" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#94a3b8">Clean C++ solutions across five judges.</text>

    <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#cbd5e1">
      <circle cx="65" cy="236" r="5" fill="#3b82f6"/><text x="79" y="241">Codeforces</text>
      <circle cx="195" cy="236" r="5" fill="#e2e8f0"/><text x="209" y="241">AtCoder</text>
      <circle cx="295" cy="236" r="5" fill="#10b981"/><text x="309" y="241">CSES</text>
      <circle cx="375" cy="236" r="5" fill="#f59e0b"/><text x="389" y="241">LeetCode</text>
      <circle cx="480" cy="236" r="5" fill="#f43f5e"/><text x="494" y="241">Toph</text>
    </g>

    <line x1="650" y1="60" x2="650" y2="220" stroke="#334155" stroke-width="1"/>

    <text x="825" y="165" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="116" font-weight="800" fill="url(#num)">330</text>
    <text x="825" y="205" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="4" fill="#94a3b8">PROBLEMS SOLVED</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
