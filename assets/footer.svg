    <circle cx="900" cy="0" r="130" fill="#6366f1" opacity="0.15"/>
    <text x="70" y="104" font-family="Georgia,'Times New Roman',serif" font-size="120" fill="#818cf8" opacity="0.35">“</text>
    <text x="500" y="80" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic" fill="#f8fafc">Understanding a problem itself</text>
